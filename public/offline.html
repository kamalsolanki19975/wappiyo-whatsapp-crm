<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Wappiyo</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="theme-color" content="#22C55E">
    <style>
        :root {
            --bg-color: #09090B;
            --card-bg: #111113;
            --border-color: #27272A;
            --text-primary: #F4F4F5;
            --text-secondary: #A1A1AA;
            --brand-primary: #22C55E;
            --brand-primary-hover: #16A34A;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #F8FAFC;
                --card-bg: #FFFFFF;
                --border-color: #E2E8F0;
                --text-primary: #0F172A;
                --text-secondary: #64748B;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .logo-wrap {
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }
        .logo-mark {
            width: 64px;
            height: 64px;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.25);
        }
        .status-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }
        p {
            font-size: 0.9375rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.25rem;
            background-color: var(--brand-primary);
            color: #FFFFFF;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.25);
            transition: background-color 0.15s ease, transform 0.15s ease;
        }
        .btn-retry:hover {
            background-color: var(--brand-primary-hover);
        }
        .btn-retry:active {
            transform: scale(0.98);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #EF4444;
            margin-bottom: 1rem;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.1);
        }
        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #EF4444;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .4; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <img src="/images/logo-mark.png" alt="Wappiyo" class="logo-mark">
        </div>
        <div class="status-pill">
            <span class="pulse-dot"></span>
            <span>NO INTERNET CONNECTION</span>
        </div>
        <h1>You are offline</h1>
        <p>Wappiyo requires an active network connection to securely deliver messages, sync conversations, and process broadcast campaigns.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 21h5v-5"/>
            </svg>
            <span>Retry Connection</span>
        </button>
    </div>

    <script>
        // Automatically reload when network connection is restored
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
